name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  SDL2_VERSION: "2.32.10"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-windows-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-windows-

      - name: Clone vcpkg
        run: |
          if (-not (Test-Path "C:\vcpkg\.git")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install sdl2:x64-windows sdl2-image:x64-windows "sdl2-mixer[core,mpg123]:x64-windows" sdl2-ttf:x64-windows opengl:x64-windows glad:x64-windows curl:x64-windows openssl:x64-windows nlohmann-json:x64-windows --recurse

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_WARN_UNUSED_CLI=OFF `
            -DCMAKE_BUILD_TYPE=Debug `
            -A x64

      - name: Build
        run: |
          cmake --build build --config Debug --parallel

      - name: Run smoke test
        run: |
          Test-Path "build\Debug\NovaCore.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore-Windows-Debug
          path: build/Debug/
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: vcpkg-android-${{ hashFiles('.github/workflows/build.yml', 'triplets/arm64-android.cmake') }}
          restore-keys: |
            vcpkg-android-

      - name: Clone vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      - name: Install dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          "$HOME/vcpkg/vcpkg" install sdl2 sdl2-image "sdl2-mixer[core,mpg123]" sdl2-ttf \
            --triplet arm64-android \
            --overlay-triplets="${{ github.workspace }}/triplets" \
            --recurse

      - name: Configure CMake
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_WARN_UNUSED_CLI=OFF \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --build build --config Debug --parallel

      - name: Run native smoke test
        run: |
          test -f build/libmain.so
          file build/libmain.so

      - name: Cache SDL2 Java sources
        id: cache-sdl2-java
        uses: actions/cache@v4
        with:
          path: sdl2-java-cache
          key: sdl2-java-${{ env.SDL2_VERSION }}

      - name: Fetch SDL2 Java sources
        if: steps.cache-sdl2-java.outputs.cache-hit != 'true'
        run: |
          mkdir -p sdl2-java-cache
          curl -L "https://github.com/libsdl-org/SDL/archive/refs/tags/release-${SDL2_VERSION}.tar.gz" -o sdl2-src.tar.gz
          tar -xzf sdl2-src.tar.gz "SDL-release-${SDL2_VERSION}/android-project/app/src/main/java"
          cp -r "SDL-release-${SDL2_VERSION}/android-project/app/src/main/java/org" sdl2-java-cache/
          rm -rf "SDL-release-${SDL2_VERSION}" sdl2-src.tar.gz

      - name: Place SDL2 Java sources into Android project
        run: |
          mkdir -p android-project/app/src/main/java
          cp -r sdl2-java-cache/org android-project/app/src/main/java/

      - name: Place native library into Android project
        run: |
          mkdir -p android-project/app/src/main/jniLibs/arm64-v8a
          cp build/libmain.so android-project/app/src/main/jniLibs/arm64-v8a/libmain.so

      - name: Cache ImageMagick package
        id: cache-imagemagick
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*imagemagick*.deb
          key: apt-imagemagick-${{ runner.os }}

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends imagemagick
          fi

      - name: Generate Android launcher icons
        run: |
          if [ ! -f "arts/icon.png" ]; then
            echo "arts/icon.png not found, skipping icon generation"
            exit 0
          fi

          command -v magick >/dev/null 2>&1 && MAGICK=magick || MAGICK=convert

          identify "arts/icon.png" || { echo "arts/icon.png is not a valid image"; exit 1; }

          declare -A DENSITIES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )

          for density in "${!DENSITIES[@]}"; do
            size="${DENSITIES[$density]}"
            outdir="android-project/app/src/main/res/mipmap-${density}"
            mkdir -p "$outdir"

            "$MAGICK" "arts/icon.png" -resize "${size}x${size}" -define png:color-type=6 -strip "$outdir/ic_launcher.png"
            cp "$outdir/ic_launcher.png" "$outdir/ic_launcher_round.png"

            identify "$outdir/ic_launcher.png"
          done

      - name: Verify Android project layout
        run: |
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/java/com/brenninho/novacore/MainActivity.java
          test -d android-project/app/src/main/java/org/libsdl/app
          test -f android-project/app/src/main/jniLibs/arm64-v8a/libmain.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Build APK
        run: |
          gradle -p android-project assembleDebug --no-daemon --stacktrace

      - name: Run APK smoke test
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-project/app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/libmain.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCore-Android-APK-Debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-android
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            android-project/app/build/outputs/logs
          if-no-files-found: ignore
